<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="Rubber duck debugging: the duck wants a raise" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="640" height="320" rx="16" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>

  <!-- water -->
  <path d="M20 235 Q50 218 80 235 T140 235 T200 235 T260 235 T320 235 T380 235 T440 235 T500 235 T560 235 T620 235 V300 H20 Z" fill="#7cc4f2"/>
  <path d="M20 255 Q50 240 80 255 T140 255 T200 255 T260 255 T320 255 T380 255 T440 255 T500 255 T560 255 T620 255" fill="none" stroke="#a8dcfa" stroke-width="3"/>

  <!-- duck body -->
  <ellipse cx="190" cy="205" rx="85" ry="50" fill="#ffd93b"/>
  <ellipse cx="170" cy="210" rx="42" ry="26" fill="#f5c400"/>
  <!-- tail -->
  <path d="M110 190 Q85 165 100 160 Q115 175 125 185 Z" fill="#ffd93b"/>
  <!-- head -->
  <circle cx="250" cy="130" r="46" fill="#ffd93b"/>
  <!-- beak -->
  <path d="M287 128 Q325 125 328 140 Q310 152 285 146 Z" fill="#ff8a1f"/>
  <!-- eye + judgmental brow -->
  <circle cx="265" cy="118" r="6" fill="#222"/>
  <circle cx="267" cy="116" r="2" fill="#fff"/>
  <path d="M254 104 L277 110" stroke="#222" stroke-width="3" stroke-linecap="round"/>

  <!-- speech bubble -->
  <rect x="345" y="30" width="270" height="86" rx="14" fill="#ffffff" stroke="#24292f" stroke-width="2.5"/>
  <path d="M352 112 L326 120 L368 116 Z" fill="#ffffff" stroke="#24292f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M356 114 L372 114" stroke="#ffffff" stroke-width="4"/>
  <text x="480" y="62" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#24292f">Have you tried explaining</text>
  <text x="480" y="86" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#24292f">it to me? I have a raise</text>
  <text x="480" y="108" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#24292f">request pending.</text>

  <!-- captions -->
  <text x="320" y="285" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" fill="#0b2a4a">...and that's when I found the bug myself.</text>
  <text x="320" y="308" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="#0b2a4a" opacity="0.8">(the duck still wants a raise)</text>
</svg>
